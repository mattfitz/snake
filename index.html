<html>
    <head>
        <style type="text/css">
            canvas { background-color: #000; width: 400px; height: 300px; }
            @media screen and (min-width: 360px) {
                canvas {
                    width: 800px;
                    height: 600px;
                }
            }
            *:focus { outline-width: 0; }
            #swipePad { width: 100%; height: 100%; background-color: #ccc; }
        </style>
        <script type="text/javascript" src="snake.js"></script>
        <script type="text/javascript" src="events.js"></script>
    </head>
    <body>
        <canvas id="myCanvas">
            Your browser does not support the canvas element.
        </canvas>
        <button onclick="initializeVideoArray()">init video array</button>
        <div>
            <label for="x">x:</label><input type="text" id="x" size="5" />
            <label for="y">y:</label><input type="text" id="y" size="5" />
            <label for="length">length:</label><input type="text" id="length" size="5" />
            <label for="speed">speed:</label><input type="text" id="speed" size="5" />
            <label for="baddies">baddies:</label><input type="text" id="baddies" size="5" />
        </div>
        <div id="swipePad">&nbsp;</div>
    </body>
</html>
